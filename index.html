<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Site Coming Soon | Lorenzo Santos</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Meta image for link previews -->
  <meta property="og:image" content="meta-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      color: #fff;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    .content {
      text-align: center;
    }
    .message {
      font-size: 2rem;
      font-weight: 500;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    /* Static first dot */
    .dot2, .dot3 {
      opacity: 0;
    }
    .dot2 {
      animation: dot2Anim 4s infinite;
    }
    .dot3 {
      animation: dot3Anim 4s infinite;
    }
    @keyframes dot2Anim {
      0%   { opacity: 0; }
      20%  { opacity: 0; }
      25%  { opacity: 1; }
      62.5% { opacity: 1; }
      75%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes dot3Anim {
      0%   { opacity: 0; }
      30%  { opacity: 0; }
      35%  { opacity: 1; }
      62.5% { opacity: 1; }
      75%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .signature {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1rem;
      font-weight: 500;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
      opacity: 0.6;
      white-space: nowrap;
    }
    .arrow {
      display: inline-block;
      margin: 0 0.4em;
      font-weight: 300;
      opacity: 0.75;
      transform: translateY(-0.05em);
    }

    /* ---------- Emoji burst ----------
       One emoji per click, cycling through the list in script.
       Outer element: one uninterrupted rise + fade on the compositor.
       Inner glyph: a short pop at the start, then no more scaling,
       so the emoji is never re-rasterized mid-flight. */
    .burst {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      width: 30px;          /* about 1.5x the pointer */
      height: 30px;
      margin: -15px 0 0 -15px;
      font-size: 30px;
      line-height: 30px;
      text-align: center;
      pointer-events: none;
      will-change: transform, opacity;
      --dx: 0px;            /* set per burst: one of three lanes */
      --dy: -120px;         /* rises four emoji lengths */
      animation:
        rise 1700ms cubic-bezier(0.16, 1, 0.3, 1) forwards,
        fade 1700ms linear forwards;
    }
    .burst > span {
      display: block;
      animation: pop 420ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes rise {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(var(--dx), var(--dy), 0); }
    }
    @keyframes fade {
      0%   { opacity: 0; }
      8%   { opacity: 1; }
      55%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes pop {
      from { transform: scale(0.4); }
      to   { transform: scale(1); }
    }

    /* ---------- Cursor ----------
       Three layers, only on devices with a real pointer:
       1. a 1-bit pixel-art arrow as the system cursor (20x30, tip at 0,0)
       2. a faded "next up" emoji riding beside the arrow
       3. a dim spotlight that follows with some lag, under the content */
    @media (hover: hover) and (pointer: fine) {
      body {
        cursor: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2720%27%20height=%2730%27%20viewBox=%270%200%2010%2015%27%20shape-rendering=%27crispEdges%27%3E%3Cg%20fill=%27%23000%27%3E%3Crect%20x=%270%27%20y=%270%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%271%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%272%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%272%27%20y=%272%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%273%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%273%27%20y=%273%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%274%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%274%27%20y=%274%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%275%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%275%27%20y=%275%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%276%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%276%27%20y=%276%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%277%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%277%27%20y=%277%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%278%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%278%27%20y=%278%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%279%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%275%27%20y=%279%27%20width=%275%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%2710%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%273%27%20y=%2710%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%276%27%20y=%2710%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%2711%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%272%27%20y=%2711%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%276%27%20y=%2711%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%270%27%20y=%2712%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%274%27%20y=%2712%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%277%27%20y=%2712%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%275%27%20y=%2713%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%278%27%20y=%2713%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%275%27%20y=%2714%27%20width=%274%27%20height=%271%27/%3E%3C/g%3E%3Cg%20fill=%27%23fff%27%3E%3Crect%20x=%271%27%20y=%272%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%273%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%274%27%20width=%273%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%275%27%20width=%274%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%276%27%20width=%275%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%277%27%20width=%276%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%278%27%20width=%277%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%279%27%20width=%274%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%2710%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%274%27%20y=%2710%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%271%27%20y=%2711%27%20width=%271%27%20height=%271%27/%3E%3Crect%20x=%274%27%20y=%2711%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%275%27%20y=%2712%27%20width=%272%27%20height=%271%27/%3E%3Crect%20x=%276%27%20y=%2713%27%20width=%272%27%20height=%271%27/%3E%3C/g%3E%3C/svg%3E") 0 0, auto;
      }
    }
    .content, .signature { position: relative; z-index: 2; }
    .signature { position: fixed; }
    #ghost, #spot {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      display: none;
      will-change: transform;
    }
    #ghost {
      z-index: 100;
      font-size: 18px;
      line-height: 1;
      opacity: 0.5;
      filter: saturate(0.85);
    }
    #ghost > span { display: block; }
    #ghost > span.swap { animation: ghostSwap 320ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes ghostSwap {
      0%   { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #spot {
      z-index: 1;
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.045) 38%,
        rgba(255, 255, 255, 0) 70%);
    }

    @media (prefers-reduced-motion: reduce) {
      .burst { animation: rise 900ms linear forwards, fade 900ms linear forwards; --dx: 0px; --dy: 0px; }
      .burst > span { animation: none; }
      #ghost > span.swap { animation: none; }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="emoji">🚧</div>
    <div class="message">
      Coming Soon<span>.</span><span class="dot2">.</span><span class="dot3">.</span>
    </div>
  </div>
  <div class="signature">Zo 🚀 NYC<span class="arrow">→</span>PHX 🌎 2026</div>
  <div id="spot" aria-hidden="true"></div>
  <div id="ghost" aria-hidden="true"><span></span></div>

  <script>
    (function () {
      // ---- Emoji burst: one per click, cycles in order ----
      var EMOJI = ['🗽', '🏜️', '🇩🇴', '🚀', '🧑‍💻', '🤖', '🍿', '🏋️', '🥾', '🍵', '🤔'];
      var LANES = ['-40px', '0px', '40px'];   // up-left, straight up, up-right
      var next = 0;

      function burst(x, y) {
        var el = document.createElement('div');
        el.className = 'burst';
        var glyph = document.createElement('span');
        glyph.textContent = EMOJI[next++ % EMOJI.length];
        el.appendChild(glyph);
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', LANES[Math.floor(Math.random() * LANES.length)]);
        el.addEventListener('animationend', function (ev) { if (ev.animationName === 'rise') el.remove(); });
        document.body.appendChild(el);
      }

      window.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        burst(e.clientX, e.clientY);
      });

      // ---- Ghost + spotlight: only on devices with a real pointer ----
      var ghost = document.getElementById('ghost');
      var spot = document.getElementById('spot');
      var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      var ghostGlyph = ghost.firstElementChild;
      function setGhost(animate) {
        ghostGlyph.textContent = EMOJI[next % EMOJI.length];
        if (animate) { ghostGlyph.classList.remove('swap'); void ghostGlyph.offsetWidth; ghostGlyph.classList.add('swap'); }
      }

      if (finePointer) {
        setGhost(false);
        var tx = innerWidth / 2, ty = innerHeight / 2;
        var gx = tx, gy = ty, sx = tx, sy = ty, seen = false;

        window.addEventListener('pointermove', function (e) {
          tx = e.clientX; ty = e.clientY;
          if (!seen) { seen = true; ghost.style.display = 'block'; spot.style.display = 'block'; }
        });
        window.addEventListener('pointerdown', function () { setGhost(true); });
        document.addEventListener('mouseleave', function () { ghost.style.display = 'none'; spot.style.display = 'none'; });
        document.addEventListener('mouseenter', function () { if (seen) { ghost.style.display = 'block'; spot.style.display = 'block'; } });

        (function follow() {
          gx += (tx - gx) * 0.35; gy += (ty - gy) * 0.35;   // ghost: slight lag
          sx += (tx - sx) * 0.18; sy += (ty - sy) * 0.18;   // spotlight: more lag
          ghost.style.transform = 'translate3d(' + (gx + 17) + 'px,' + (gy + 22) + 'px,0)';
          spot.style.transform  = 'translate3d(' + sx + 'px,' + sy + 'px,0)';
          requestAnimationFrame(follow);
        })();
      } else {
        ghost.remove();
        spot.remove();
      }
    })();
  </script>
</body>
</html>
